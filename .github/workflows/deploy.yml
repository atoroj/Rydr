name: CI/CD

# En cada push a main: tests → build de la imagen del backend y subida a
# GHCR → redeploy en el VPS por SSH. En un pull request contra main solo
# corren los tests (gate antes de fusionar), sin build ni deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests backend
    runs-on: ubuntu-latest
    env:
      # No hace falta que sean los de verdad — los tests no llegan a
      # ningún servicio externo con esto, solo firman/verifican JWT
      # propios de la sesión de test (ver app/shared/security.py).
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar pipenv
        run: pip install pipenv

      - name: Instalar dependencias (incluye las de test)
        run: pipenv install --dev --deploy

      - name: pytest
        run: pipenv run pytest -v

  build-and-push:
    name: Build y publica imagen (GHCR)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El driver "docker" por defecto del runner no soporta el exportador
      # de caché de GitHub Actions (cache-from/cache-to: type=gha, más
      # abajo) — hace falta el driver "docker-container" que monta este
      # paso, o build-push-action falla con "Cache export is not
      # supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/atoroj/rydr-backend:latest
            ghcr.io/atoroj/rydr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Solo hace falta SSH al VPS — la imagen ya está en GHCR (paso
      # anterior) y docker-compose.yml/Caddyfile/legal ya están en el
      # propio repo, que el VPS mantiene clonado (ver DEPLOY.md).
      - name: SSH y redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/rydr
            git pull origin main
            docker compose pull backend
            docker compose up -d
            docker image prune -f
