name: rydr
description: "Strava para motociclistas — graba rutas GPS y compártelas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Estado global
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Navegación
  go_router: ^14.6.2

  # Almacenamiento seguro (JWT token)
  flutter_secure_storage: ^9.2.2

  # GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Mapas (OpenStreetMap)
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  mapbox_maps_flutter: ^2.28.0
  flutter_tts: ^4.2.5

  # Selección de fotos (perfil, motos, portada de ruta)
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
