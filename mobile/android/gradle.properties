org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle 8.14 no soporta JDK 25 (el JBR que trae Android Studio por defecto).
# Forzamos el JDK 17 instalado vía Homebrew (brew install openjdk@17) para
# que tanto Android Studio como `./gradlew` en terminal usen uno compatible.
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.20/libexec/openjdk.jdk/Contents/Home

# AGP 9 trae Kotlin integrado. mapbox_maps_flutter (y otros plugins) esperan
# que esté activo cuando compileSdk usa AGP 9+; con este flag en false (el
# valor por defecto que puso la plantilla de Flutter) su build.gradle falla
# con "Could not find method kotlin()".
android.builtInKotlin=true

# Vive en ~/.gradle/gradle.properties (fuera del repo) para no commitear el secreto.
# Gradle fusiona automáticamente las propiedades globales con las del proyecto.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
